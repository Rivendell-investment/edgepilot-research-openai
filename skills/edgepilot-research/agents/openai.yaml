interface:
  display_name: "EdgePilot Research"
  short_description: "Discover and backtest public strategies"
  default_prompt: "Use $edgepilot-research in my language. Before onboarding, call verify_activation; continue in the same reply when ready and require a Codex restart only when it reports restart_required. Guide me into the existing V2 matching flow and call recommend_strategies so ChatGPT can render the three cards. If I also ask to open the Research Dashboard, call open_dashboard directly after the cards and use its verified URL; do not check or install the runtime unless I ask to backtest."
