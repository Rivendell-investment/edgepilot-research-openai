[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgepilot-research"
dynamic = ["version"]
description = "Public market strategy research and reproducible backtesting"
requires-python = ">=3.12,<3.15"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
edgepilot-research = "edgepilot_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgepilot_research"]

[tool.hatch.version]
path = "src/edgepilot_research/VERSION"
pattern = "^(?P<version>(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*))$"
